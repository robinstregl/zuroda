<!doctype html><html><head><meta charset="utf-8"><title>Sheet</title><style>html,body{margin:0}body{font-family:var(--font-sans);color:var(--amber)}*{box-sizing:border-box}
.btn{font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:100%;min-height:52px;padding:10px 16px;border-radius:var(--radius-pill);font-size:17px;font-weight:600;letter-spacing:.03em;cursor:pointer}
.btn small{font-size:11.5px;font-weight:500;opacity:.88;letter-spacing:0}
.meta{margin-top:10px;font-size:12px;line-height:1.45;color:var(--ink)}
.meta b{display:block;font-size:13px}
.ok{color:#1f5f2a;font-weight:600}.bad{color:#9c2f16;font-weight:600}
.ground{background-color:var(--sand-lit);background-image:radial-gradient(rgba(120,80,45,.28) 1px,transparent 1.6px),radial-gradient(rgba(255,250,240,.45) 1px,transparent 1.7px),repeating-linear-gradient(176deg,rgba(150,105,60,.10) 0 2px,transparent 2px 26px);background-size:23px 23px,31px 31px,auto;background-position:0 0,11px 7px,0 0;padding:var(--space-5) var(--space-5) 0;min-height:300px;display:flex;align-items:flex-end}
.sh{width:100%;background:var(--night);border:3px solid var(--frame);border-bottom:0;border-radius:var(--radius-lg) var(--radius-lg) 0 0;padding:var(--space-5)}
h2{margin:0 0 2px;font-size:23px;font-weight:600;text-shadow:0 0 8px rgba(255,176,96,.45)}
.lv{font-size:11px;letter-spacing:.14em;color:var(--amber-dim);margin-bottom:8px}
p{margin:0 0 10px;font-size:14px;line-height:1.45}
.eff{background:rgba(255,226,184,.07);border:1px solid rgba(255,226,184,.14);border-radius:var(--radius-sm);padding:8px 12px;font-size:14px;margin:10px 0}
.eff b{color:var(--water)}
.cost{font-size:14px;margin:8px 0}.no{color:var(--ember)}
.up{background:var(--terra);color:#fff7ea;border:0}
</style></head><body><div class="ground"><div class="sh">
<h2>Water Pump</h2><div class="lv">LEVEL 2 / 6</div>
<p>An old pump robot. It pumps water from deep underground into your well.</p>
<div class="eff">Well: <b>46 / 60 L</b> · refills <b>1.6 L/min</b></div>
<div class="cost">Upgrade: 80 scrap · <span class="no">3 gold (you have 1)</span></div>
<button class="btn up" disabled style="opacity:.5">Upgrade</button>
</div></div></body></html>
