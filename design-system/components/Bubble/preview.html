<!doctype html><html><head><meta charset="utf-8"><title>Bubble</title><style>html,body{margin:0}body{font-family:var(--font-sans);color:var(--amber)}*{box-sizing:border-box}
.btn{font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:100%;min-height:52px;padding:10px 16px;border-radius:var(--radius-pill);font-size:17px;font-weight:600;letter-spacing:.03em;cursor:pointer}
.btn small{font-size:11.5px;font-weight:500;opacity:.88;letter-spacing:0}
.meta{margin-top:10px;font-size:12px;line-height:1.45;color:var(--ink)}
.meta b{display:block;font-size:13px}
.ok{color:#1f5f2a;font-weight:600}.bad{color:#9c2f16;font-weight:600}
.ground{background-color:var(--sand-lit);background-image:radial-gradient(rgba(120,80,45,.28) 1px,transparent 1.6px),radial-gradient(rgba(255,250,240,.45) 1px,transparent 1.7px),repeating-linear-gradient(176deg,rgba(150,105,60,.10) 0 2px,transparent 2px 26px);background-size:23px 23px,31px 31px,auto;background-position:0 0,11px 7px,0 0;padding:var(--space-4);min-height:120px;display:flex;gap:var(--space-4);align-items:flex-start}
.bub{background:var(--night);color:var(--amber);border-radius:18px 18px 18px 4px;padding:10px 14px;font-size:14px;line-height:1.4;max-width:300px;box-shadow:0 4px 14px rgba(58,42,32,.25)}
.toast{background:var(--night);color:var(--amber);border:2px solid var(--frame);border-radius:var(--radius-md);padding:10px 14px;font-size:14px;line-height:1.35}
.toast b{display:block;font-size:15px}.toast span{color:var(--amber-dim);font-size:13px}
</style></head><body><div class="ground">
<div class="bub">Make a Hammer in the Workshop – then we can take wrecks apart.</div>
<div class="toast"><b>Water bottle</b><span>You can carry 3 / 4. It gets filled at the well.</span></div>
</div></body></html>
