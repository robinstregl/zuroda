<!-- @dsCard group="Návrhy" height=300 subtitle="Fill up &amp; go na písku: dnes a varianty A, B, C" -->
<!doctype html><html><head><meta charset="utf-8"><title>Primary button</title><style>html,body{margin:0}body{font-family:var(--font-sans);color:var(--amber)}*{box-sizing:border-box}
.btn{font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:100%;min-height:52px;padding:10px 16px;border-radius:var(--radius-pill);font-size:17px;font-weight:600;letter-spacing:.03em;cursor:pointer}
.btn small{font-size:11.5px;font-weight:500;opacity:.88;letter-spacing:0}
.meta{margin-top:10px;font-size:12px;line-height:1.45;color:var(--ink)}
.meta b{display:block;font-size:13px}
.ok{color:#1f5f2a;font-weight:600}.bad{color:#9c2f16;font-weight:600}
.ground{background-color:var(--sand-lit);background-image:radial-gradient(rgba(120,80,45,.28) 1px,transparent 1.6px),radial-gradient(rgba(255,250,240,.45) 1px,transparent 1.7px),repeating-linear-gradient(176deg,rgba(150,105,60,.10) 0 2px,transparent 2px 26px);background-size:23px 23px,31px 31px,auto;background-position:0 0,11px 7px,0 0;padding:var(--space-5);display:grid;grid-template-columns:repeat(4,1fr);gap:var(--space-4);min-height:300px}
.col{display:flex;flex-direction:column}
.now{background:var(--terra);color:#fff7ea;border:0;box-shadow:0 6px 18px rgba(200,100,60,.3)}
.a{background:var(--night);color:var(--amber);border:3px solid var(--frame);box-shadow:0 8px 20px rgba(29,26,24,.35)}
.a .w{color:var(--water);display:inline-flex;vertical-align:-2px;margin-right:6px}
.b{background:var(--proposal-water-deep);color:var(--amber);border:3px solid var(--frame);box-shadow:0 8px 20px rgba(29,26,24,.35)}
.c{background:var(--proposal-terra-deep);color:#fff7ea;border:0;box-shadow:0 0 0 2px rgba(29,26,24,.55),0 8px 20px rgba(29,26,24,.35)}
.tag{font-size:11px;letter-spacing:.14em;font-weight:600;color:var(--ink);margin-bottom:8px}
</style></head><body><div class="ground">
<div class="col"><div class="tag">DNES</div><button class="btn now">Fill up &amp; go<small>2.0 L from the well</small></button><div class="meta"><b>terra</b>vůči písku <span class="bad">2,2 : 1</span><br>text <span class="bad">3,7 : 1</span></div></div>
<div class="col"><div class="tag">A · NOČNÍ ★</div><button class="btn a"><span><span class="w"><svg viewBox="0 0 24 24" width="16" height="16"><path d="M12 3c3 5 6 8 6 11.5A6 6 0 0 1 6 14.5C6 11 9 8 12 3z" fill="currentColor"/></svg></span>Fill up &amp; go</span><small>2.0 L from the well</small></button><div class="meta"><b>night + frame</b>vůči písku <span class="ok">9,5 : 1</span><br>text <span class="ok">13,9 : 1</span></div></div>
<div class="col"><div class="tag">B · VODNÍ TYRKYS</div><button class="btn b">Fill up &amp; go<small>2.0 L from the well</small></button><div class="meta"><b>proposal-water-deep</b>vůči písku <span class="ok">3,2 : 1</span><br>text <span class="ok">4,6 : 1</span></div></div>
<div class="col"><div class="tag">C · TMAVÁ TERAKOTA</div><button class="btn c">Fill up &amp; go<small>2.0 L from the well</small></button><div class="meta"><b>proposal-terra-deep</b>vůči písku <span class="ok">3,7 : 1</span><br>text <span class="ok">6,3 : 1</span></div></div>
</div></body></html>
