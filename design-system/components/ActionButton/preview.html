<!-- @dsCard group="Návrhy" height=190 subtitle="Dismantle / Build camp na výpravě" -->
<!doctype html><html><head><meta charset="utf-8"><title>Action button</title><style>html,body{margin:0}body{font-family:var(--font-sans);color:var(--amber)}*{box-sizing:border-box}
.btn{font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:100%;min-height:52px;padding:10px 16px;border-radius:var(--radius-pill);font-size:17px;font-weight:600;letter-spacing:.03em;cursor:pointer}
.btn small{font-size:11.5px;font-weight:500;opacity:.88;letter-spacing:0}
.meta{margin-top:10px;font-size:12px;line-height:1.45;color:var(--ink)}
.meta b{display:block;font-size:13px}
.ok{color:#1f5f2a;font-weight:600}.bad{color:#9c2f16;font-weight:600}
.ground{background-color:var(--sand-lit);background-image:radial-gradient(rgba(120,80,45,.28) 1px,transparent 1.6px),radial-gradient(rgba(255,250,240,.45) 1px,transparent 1.7px),repeating-linear-gradient(176deg,rgba(150,105,60,.10) 0 2px,transparent 2px 26px);background-size:23px 23px,31px 31px,auto;background-position:0 0,11px 7px,0 0;padding:var(--space-5);display:grid;grid-template-columns:1fr 1fr;gap:var(--space-5);min-height:190px}
.now{background:var(--act);color:var(--ink);border:0;font-weight:700;box-shadow:0 4px 14px rgba(58,42,32,.25)}
.p{background:var(--night);color:var(--gold);border:3px solid var(--gold);box-shadow:0 0 0 4px rgba(255,211,110,.18),0 8px 20px rgba(29,26,24,.35)}
.tag{font-size:11px;letter-spacing:.14em;font-weight:600;color:var(--ink);margin-bottom:8px}
</style></head><body><div class="ground">
<div><div class="tag">DNES</div><button class="btn now">Dismantle<small>car · needs Hammer II</small></button><div class="meta"><b>act</b>vůči písku <span class="bad">1,1 : 1</span>, text 8,2 : 1</div></div>
<div><div class="tag">NÁVRH</div><button class="btn p">Dismantle<small>car · needs Hammer II</small></button><div class="meta"><b>night + gold</b>vůči písku <span class="ok">9,5 : 1</span>, text <span class="ok">12,2 : 1</span></div></div>
</div></body></html>
