<!doctype html><html><head><meta charset="utf-8"><title>World label</title><style>html,body{margin:0}body{font-family:var(--font-sans);color:var(--amber)}*{box-sizing:border-box}
.btn{font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:100%;min-height:52px;padding:10px 16px;border-radius:var(--radius-pill);font-size:17px;font-weight:600;letter-spacing:.03em;cursor:pointer}
.btn small{font-size:11.5px;font-weight:500;opacity:.88;letter-spacing:0}
.meta{margin-top:10px;font-size:12px;line-height:1.45;color:var(--ink)}
.meta b{display:block;font-size:13px}
.ok{color:#1f5f2a;font-weight:600}.bad{color:#9c2f16;font-weight:600}
.ground{background-color:var(--sand-lit);background-image:radial-gradient(rgba(120,80,45,.28) 1px,transparent 1.6px),radial-gradient(rgba(255,250,240,.45) 1px,transparent 1.7px),repeating-linear-gradient(176deg,rgba(150,105,60,.10) 0 2px,transparent 2px 26px);background-size:23px 23px,31px 31px,auto;background-position:0 0,11px 7px,0 0;padding:var(--space-5);display:grid;grid-template-columns:1fr 1fr;gap:var(--space-5);min-height:150px;align-items:center;justify-items:center}
.lbl{display:inline-block;font-size:10.5px;line-height:15px;font-weight:600;padding:0 6px;border-radius:7px}
.now{background:rgba(255,248,232,.75);color:rgba(58,42,32,.85)}
.p{background:var(--night);color:var(--amber);border:1.5px solid rgba(236,227,207,.85);padding:1px 8px;border-radius:var(--radius-pill)}
.cost{display:block;text-align:center;font-size:9.5px;margin-top:3px}
.now+.cost{color:rgba(58,42,32,.65)}
.pc{color:var(--gold)}
.tag{font-size:11px;letter-spacing:.14em;font-weight:600;color:var(--ink);margin-bottom:10px;text-align:center}
</style></head><body><div class="ground">
<div><div class="tag">DNES</div><span class="lbl now">Water Pump 2</span><span class="cost">34 scrap · 1 gold</span></div>
<div><div class="tag">NÁVRH</div><span class="lbl p">Water Pump 2</span><span class="cost"><span class="lbl p" style="font-weight:500"><span class="pc">34</span> scrap · <span class="pc">1</span> gold</span></span></div>
</div></body></html>
